name: Build ENA CI Prépa APK V5 FIXED

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find and extract V5 project
        shell: bash
        run: |
          ZIP=$(find . -maxdepth 2 -type f -name 'ENA_CI_PREPA_V5_FIXED.zip' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "ENA_CI_PREPA_V5_FIXED.zip introuvable"
            exit 1
          fi
          mkdir -p project
          unzip -q "$ZIP" -d project

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        working-directory: project
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ENA-CI-PREPA-V5-FIXED-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
