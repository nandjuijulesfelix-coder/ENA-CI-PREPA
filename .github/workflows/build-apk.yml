name: Build ENA CI Prépa APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le projet
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Décompresser le projet V4
        run: |
          mkdir project
          unzip ENA_CI_PREPA_V4_GITHUB.zip -d project

      - name: Construire l'APK
        working-directory: project
        run: gradle :app:assembleDebug

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: ENA-CI-PREPA-V4-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
